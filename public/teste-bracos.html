<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prévia de retratos — Clínica São Lucas</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#eaf0ff;background:#061e31}
    *{box-sizing:border-box}
    body{margin:0;padding:30px clamp(16px,4vw,60px)}
    header{max-width:1200px;margin:0 auto 34px}
    h1{font-size:clamp(28px,4vw,48px);margin:0 0 12px;line-height:1.05}
    p{max-width:850px;color:#bed0de;line-height:1.5;margin:0 0 20px}
    a{color:#ff8a18}
    .links{display:flex;gap:20px;flex-wrap:wrap}
    main{max-width:1400px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
    article{border:1px solid #456077;border-radius:14px;overflow:hidden;background:#0d304b}
    h2{font-size:18px;margin:0;padding:16px;border-bottom:1px solid #456077}
    .pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#456077}
    figure{min-width:0;margin:0;background:#133b5a}
    figcaption{padding:9px 12px;color:#f4f7ff;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .frame{height:310px;display:flex;align-items:end;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 35%,#295a91,#09283f 75%)}
    img{display:block;max-width:100%;max-height:100%;object-fit:contain;object-position:center bottom}
    .note{display:block;padding:11px 16px;font-size:12px;line-height:1.4;color:#bed0de}
  </style>
</head>
<body>
  <header>
    <h1>Retratos: antes e depois</h1>
    <p>Comparação dos recortes originais com os retratos reconstruídos aplicados ao site. Os arquivos originais continuam disponíveis para comparação.</p>
    <div class="links"><a href="/">Ver no site</a></div>
  </header>
  <main id="gallery"></main>
  <script>
    const items = [
      ['hero','Dr. Ademy Barros Landim','ademy-landim'],
      ['hero','Dr. Dhiego Ramalho','dhiego-ramalho'],
      ['hero','Dra. Ilka Gominho','ilka-gominho'],
      ['agenda','Dra. Ariane Matos','ariane-matos'],
      ['agenda','Dra. Bruna Bastos','bruna-bastos'],
      ['agenda','Dr. Caio Alves','caio-alves'],
      ['agenda','Dr. Cleobenysson Cruz','cleobenysson-cruz'],
      ['agenda','Débora Cordeiro','debora-cordeiro'],
      ['agenda','Dr. Dhiego Ramalho (agenda)','dhiego-ramalho'],
      ['agenda','Dr. Eduardo Bastos','eduardo-bastos'],
      ['agenda','Emiliane Cruz','emiliane-cruz'],
      ['agenda','Joceane Ramos','joceane-ramos'],
      ['agenda','Dr. Marcelo Amaral','marcelo-amaral'],
      ['agenda','Raquel Andrade','raquel-andrade'],
      ['agenda','Dra. Renata Filgueira','renata-filgueira'],
      ['agenda','Dr. Vinícius Aquino','vinicius-aquino'],
    ];
    const gallery=document.getElementById('gallery');
    for(const [group,name,id] of items){
      const article=document.createElement('article');
      article.innerHTML=`<h2>${name}</h2><div class="pair"><figure><figcaption>Original · ${group}</figcaption><div class="frame"><img loading="lazy" src="/profissionais/${group}/${id}.webp" alt="Foto original de ${name}"></div></figure><figure><figcaption>Aplicado no site</figcaption><div class="frame"><img loading="lazy" src="/profissionais/reconstruidos/${group}/${id}.webp" alt="Retrato reconstruído de ${name}"></div></figure></div><small class="note">${group==='hero'?'Retrato do hero':'Retrato da agenda, painel e equipe'}</small>`;
      gallery.append(article);
    }
  </script>
</body>
</html>
